# Ontology Index
# 도메인 목록과 비즈니스 위계. 이 파일이 탐색의 진입점.
# Claude는 매 요청 시 이 파일을 먼저 읽고, 관련 도메인 파일로 이동한다.

domains:
  - id: accommodation
    path: 숙박/예약
    file: abox/accommodation.yaml
    summary: 숙소·객실 타입·일자별 재고/요금·찜·예약·결제(PG 연동)를 다루는 숙박 커머스 도메인
    repos:
      - e-commerce-BE
    infra:
      - mysql
      - redis

  - id: coupon
    path: 숙박/쿠폰
    file: abox/coupon.yaml
    summary: 정액/정률 쿠폰의 발급·사용·관리. 예약 결제 시 할인 적용 (Round 4)
    repos:
      - e-commerce-BE
    infra:
      - mysql

cross_domain: abox/cross-domain.yaml
shared_infra: abox/infra.yaml
