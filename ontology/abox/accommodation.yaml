# A-Box: accommodation 도메인
# 숙박 커머스의 핵심 비즈니스 개념과 관계를 정의한다.
# 코드 위치는 entity.repo + package로 명시 (Round 3 구현 시점까지는 planned 상태).

domain:
  id: accommodation
  name: 숙박 커머스
  summary: 숙소·객실 타입·일자별 재고/요금·찜·예약·결제를 다루는 도메인. Round 2 설계 확정, Round 3에서 예약 생성 핵심 슬라이스(Reservation·재고 차감·가격 스냅샷) 구현, Round 4에서 찜(Wishlist·찜 수 카운터)과 예약-쿠폰 트랜잭션/락/동시성 구현, Round 5에서 숙소 검색·상세 조회(Property/RoomType·인덱스·Redis 캐시) 구현, Round 6에서 예약 확정·취소·만료(재고/쿠폰 복구·만료 스케줄러) 구현, Round 6.5에서 PG 결제 연동(결제 API·콜백 검증·상태 동기화·서킷 브레이커) 구현.
  wiki_root: wiki/accommodation/

# ══════════════════════════════════════
# Entities
# ══════════════════════════════════════

entities:
  # ─── Data ───
  - id: property
    name: Property (숙소)
    type: data
    summary: 호텔·펜션·모텔·리조트 단위의 판매 단위. 한 Property는 N개 RoomType을 소유한다. 호스트가 등록·관리한다. Round 5 구현은 검색에 필요한 최소 필드(name, city)만 보유하며 city 에 단일 인덱스(idx_property_city)를 둔다.
    wiki_doc: wiki/accommodation/glossary.md#property
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/property
    status: active

  - id: room-type
    name: RoomType (객실 타입)
    type: data
    summary: 한 Property가 판매하는 객실 카테고리(스탠다드 더블, 디럭스 트윈 등). 수용 인원(capacity)을 보유. 1 Property : N RoomType. Round 5 구현은 최소 필드(name, capacity)만 보유하며 (property_id, capacity) 복합 인덱스(idx_room_type_property_capacity)를 둔다.
    wiki_doc: wiki/accommodation/glossary.md#roomtype
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/property
    status: active

  - id: daily-room-inventory
    name: DailyRoomInventory (일자별 재고)
    type: data
    summary: 특정 (room_type_id, date) 단위의 잔여 객실 수량. 복합 PK + atomic UPDATE로 더블부킹을 구조적으로 차단한다.
    wiki_doc: wiki/accommodation/glossary.md#daily-room-inventory
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/accommodation
    status: active

  - id: daily-room-rate
    name: DailyRoomRate (일자별 요금)
    type: data
    summary: 특정 (room_type_id, date)의 1박 요금. 검색 시 합산해 totalAmount/avgNightlyPrice를 계산하고, PENDING 생성 시점에 reservation_nightly로 스냅샷된다.
    wiki_doc: wiki/accommodation/glossary.md#daily-room-rate
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/accommodation
    status: active

  - id: reservation
    name: Reservation (예약)
    type: data
    summary: 게스트의 객실 점유 계약. PENDING → CONFIRMED → CHECKED_IN → CHECKED_OUT 또는 CANCELLED/NO_SHOW 상태 머신을 보유. PENDING 생성 시점의 가격 스냅샷·만료 시각·취소 사유를 함께 관리한다.
    wiki_doc: wiki/accommodation/glossary.md#reservation
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/accommodation
    status: active

  - id: reservation-nightly
    name: ReservationNightly (예약 일자별 스냅샷)
    type: data
    summary: Reservation 1건이 점유한 N일을 일자·금액 row로 분해한 가격 스냅샷. 후속 라운드의 환불 산정 기반.
    wiki_doc: wiki/accommodation/glossary.md#reservation-nightly
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/accommodation
    status: active

  - id: wishlist
    name: Wishlist (찜)
    type: data
    summary: 게스트가 Property를 즐겨찾기한 기록. (guest_id, property_id) UNIQUE. Round 4 구현 — 별도 최상위 패키지(domain/wishlist)에 배치.
    wiki_doc: wiki/accommodation/glossary.md#wishlist
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/wishlist
    status: active

  - id: property-wishlist-count
    name: PropertyWishlistCount (숙소 찜 수)
    type: data
    summary: 숙소별 찜 수 카운터 row. COUNT(*) 집계 대신 별도 카운터를 두어 조회를 빠르게 하고, 원자적 조건부 UPDATE(count±1)로 동시 찜/찜취소 Lost Update를 차단한다.
    wiki_doc: wiki/accommodation/glossary.md#property-wishlist-count
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/wishlist
    status: active

  - id: payment
    name: Payment (결제)
    type: data
    summary: 예약 1건에 대한 결제 시도 기록. CREATED → REQUESTED → SUCCESS/FAILED 상태 머신 + 접수 확정 실패(REQUEST_FAILED). 금액·orderId(예약 ID 6자리 패딩)·guestId 는 예약에서 확정하고, 진행 중/성공 결제가 있으면 재생성하지 않는 멱등 가드(예약 행 잠금)로 동일 예약 이중 결제를 차단한다.
    wiki_doc: wiki/accommodation/glossary.md#payment
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/payment
    status: active

  # ─── Process ───
  - id: property-search
    name: PropertySearch (숙소 검색·상세 조회)
    type: process
    summary: 도시·체크인·체크아웃·인원수로 가용 숙소를 검색하고 숙소 상세를 조회한다. 네이티브 SQL 파생 테이블에서 (객실타입×일자) GROUP BY + HAVING COUNT = 박수 로 전 일자 가용을 판정하고 숙소별 MIN(기간 총액)을 집계. 정렬 3종 — 가격 오름차순 / 찜 수 내림차순 / 추천(찜수·가격 로그 스케일 가중 스코어 0.7·0.3). Redis cache-aside — 검색 페이지 60초, 상세 10분 TTL, 찜 수·재고·요금은 캐시하지 않음(결제 시점 DB 재확인). 캐시 장애 시 DB 폴백으로 정상 동작.
    wiki_doc: wiki/accommodation/design-decisions.md#search
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/property
    status: active

  - id: reservation-service
    name: ReservationService
    type: process
    summary: 예약 생성·확정·취소·만료를 다루는 도메인 서비스. Reservation aggregate의 상태 전이를 호출하고 InventoryService에 재고 차감/복구를 위임한다. 상태 전이는 예약 행 FOR UPDATE 잠금 후 애그리거트 전이 가드로 직렬화하며, 취소·만료 시 재고는 항상, 쿠폰은 PENDING에서 취소·만료된 경우만 복구한다.
    wiki_doc: wiki/accommodation/design-decisions.md#reservation-flow
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/accommodation
    status: active

  - id: inventory-service
    name: InventoryService
    type: process
    summary: 일자별 재고 차감·복구 단독 책임. 단일 RDB 트랜잭션 + atomic UPDATE(차감은 WHERE remaining > 0, 복구는 +1)로 동시성 보장. Reservation 도메인은 직접 inventory를 만지지 않는다.
    wiki_doc: wiki/accommodation/design-decisions.md#inventory-atomic
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/accommodation
    status: active

  - id: expiration-scheduler
    name: ExpirationScheduler
    type: process
    summary: 1분 주기로 만료된 PENDING 예약을 스캔(FOR UPDATE SKIP LOCKED)하여 cancel + release를 실행. 사용자 결제 재진입 시점도 같은 expire 함수를 호출. scheduler.reservation-expiration.enabled 프로퍼티로 끌 수 있다(기본 on).
    wiki_doc: wiki/accommodation/design-decisions.md#pending-expiration
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/application/accommodation/scheduler
    status: active

  - id: wishlist-service
    name: WishlistService
    type: process
    summary: 찜/찜취소와 숙소별 찜 수 카운터 증감을 단일 트랜잭션에서 처리한다. 원자적 조건부 UPDATE(count±1) + read-your-writes로 동시 요청의 찜 수 정합성을 보장한다.
    wiki_doc: wiki/accommodation/design-decisions.md#transaction-lock
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/wishlist
    status: active

  - id: payment-service
    name: PaymentService
    type: process
    summary: 결제 생성(멱등)과 PG 결과의 DB 반영 담당. PG 호출(외부 HTTP)은 트랜잭션 밖의 PaymentFacade(application/payment)가 수행하고, 이 서비스는 개별 트랜잭션에서 결제 행 잠금 + 종결 상태 no-op 으로 중복 콜백·동시 폴링에 멱등하게 반영한다. 콜백은 본문을 신뢰하지 않고 transactionKey 로 PG 재조회 검증 후 반영.
    wiki_doc: wiki/accommodation/design-decisions.md#payment-integration
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/domain/payment
    status: active

  - id: payment-sync-scheduler
    name: PaymentSyncScheduler
    type: process
    summary: 30초 주기로 결과 미확정(CREATED/REQUESTED) 결제를 PG 조회로 사후 확정 — 콜백 유실·접수 응답 유실(타임아웃) 복구 경로. 1분 유예 후 스캔하고, 주문 조회 3분법(목록=존재 확정/빈=없음 확정/null=불명)과 claimed-key 필터로 이중 결제를 막는다. scheduler.payment-sync.enabled 로 끌 수 있다(기본 on).
    wiki_doc: wiki/accommodation/design-decisions.md#payment-sync
    repo: e-commerce-BE
    package: apps/commerce-api/src/main/kotlin/com/loopers/application/payment/scheduler
    status: active

  # ─── External ───
  - id: payment-gateway
    name: PaymentGateway (외부 PG)
    type: external
    summary: 외부 결제 시스템. 로컬은 apps/pg-simulator 로 시뮬레이션(요청 성공 60%·처리 성공 70%). PaymentFacade 가 트랜잭션 밖에서 OpenFeign 으로 호출하고 결과는 콜백 + 상태 동기화로 수신. Feign 타임아웃(연결 1s/읽기 3s)과 서킷 브레이커 2분리(pg-payment 임계 60% / pg-query 50%)로 보호. 트랜잭션 경계 밖.

# ══════════════════════════════════════
# Relations
# ══════════════════════════════════════

relations:
  # ─── 구조 (소유·일부) ───
  - from: property
    to: room-type
    type: owns
    note: 1 Property : N RoomType. property_id FK
  - from: room-type
    to: daily-room-inventory
    type: owns
    note: 1 RoomType : N DailyRoomInventory (date별). UNIQUE(room_type_id, date) — 설계는 복합 PK
  - from: room-type
    to: daily-room-rate
    type: owns
    note: 1 RoomType : N DailyRoomRate (date별). UNIQUE(room_type_id, date) — 설계는 복합 PK
  - from: reservation
    to: reservation-nightly
    type: owns
    note: Reservation 1건당 N개 ReservationNightly (체크인~체크아웃-1 일자별 스냅샷)

  # ─── 참조 (소유·의존 없는 단방향) ───
  - from: reservation
    to: room-type
    type: references
    note: room_type_id FK. 점유 대상이지만 RoomType이 Reservation을 소유하지는 않음
  - from: wishlist
    to: property
    type: references
    note: property_id FK + (guest_id, property_id) UNIQUE
  - from: property-wishlist-count
    to: property
    type: references
    note: property_id PK·FK. 숙소당 1 row의 찜 수 카운터

  # ─── 검색 협력 ───
  - from: property-search
    to: property
    type: consumes
    note: city 필터 (idx_property_city) + 상세 조회 대상
  - from: property-search
    to: room-type
    type: consumes
    note: capacity >= guestCount 필터 (idx_room_type_property_capacity)
  - from: property-search
    to: daily-room-inventory
    type: consumes
    note: remaining > 0 이고 기간 전 일자 충족(HAVING COUNT = 박수)한 RoomType만 남김
  - from: property-search
    to: daily-room-rate
    type: consumes
    note: 기간 요금 합산 후 숙소별 MIN(총액). 요금 원본은 캐시하지 않음
  - from: property-search
    to: property-wishlist-count
    type: consumes
    note: 찜 수 정렬·추천 스코어 계산 및 검색/상세 응답 표시 (LEFT JOIN, 없으면 0)

  # ─── 예약 흐름 ───
  - from: reservation-service
    to: reservation
    type: owns
    note: Reservation aggregate의 라이프사이클 관리 (생성·상태 전이)
  - from: reservation-service
    to: inventory-service
    type: depends_on
    note: 재고 차감·복구를 위임 (B1 합의)
  - from: inventory-service
    to: daily-room-inventory
    type: owns
    note: atomic UPDATE로 remaining 차감·복구

  # ─── 결제 흐름 ───
  - from: payment-service
    to: payment
    type: owns
    note: Payment 라이프사이클 관리 (멱등 생성·상태 반영). 행 잠금 + 종결 상태 no-op
  - from: payment
    to: reservation
    type: references
    note: reservation_id 참조. orderId = 예약 ID 6자리 패딩, 금액은 예약 스냅샷에서 확정
  - from: payment-service
    to: payment-gateway
    type: references
    note: PG 호출은 PaymentFacade(TX 밖) 경유. 접수 결과 3분법 — Accepted/Rejected(확정 실패)/Unknown(타임아웃, 사후 확정)
  - from: payment-service
    to: reservation-service
    type: triggers
    note: 결제 SUCCESS→confirm, FAILED→cancel(PAYMENT_FAILED). PaymentFacade 가 후속 전이 호출, 확정 실패 시 수동 환불 로그
  - from: payment-sync-scheduler
    to: payment-service
    type: triggers
    note: 결과 미확정 건을 PG 조회로 settle. 콜백 유실·접수 불명(타임아웃) 복구

  # ─── 찜 흐름 ───
  - from: wishlist-service
    to: wishlist
    type: owns
    note: 찜/찜취소 라이프사이클 관리 (생성·삭제)
  - from: wishlist-service
    to: property-wishlist-count
    type: owns
    note: 원자적 조건부 UPDATE로 count 증감 + read-your-writes 반환

  # ─── 만료·취소 흐름 ───
  - from: expiration-scheduler
    to: reservation-service
    type: triggers
    note: 만료 PENDING 발견 시 expire(id) 호출
  - from: reservation-service
    to: reservation
    type: triggers
    note: state machine 전이 (PENDING→CONFIRMED/CANCELLED, CONFIRMED→NO_SHOW/CHECKED_IN, ...)

  # ─── 배포 ───
  - from: property-search
    to: mysql
    type: deployed_in
  - from: property-search
    to: redis
    type: deployed_in
    note: 검색 페이지·상세 캐시(cache-aside). 읽기는 replica 우선, 쓰기는 master
  - from: property
    to: mysql
    type: deployed_in
  - from: room-type
    to: mysql
    type: deployed_in
  - from: reservation-service
    to: mysql
    type: deployed_in
  - from: inventory-service
    to: mysql
    type: deployed_in
  - from: expiration-scheduler
    to: mysql
    type: deployed_in
  - from: reservation
    to: mysql
    type: deployed_in
  - from: daily-room-inventory
    to: mysql
    type: deployed_in
  - from: daily-room-rate
    to: mysql
    type: deployed_in
  - from: wishlist
    to: mysql
    type: deployed_in
  - from: property-wishlist-count
    to: mysql
    type: deployed_in
  - from: wishlist-service
    to: mysql
    type: deployed_in
  - from: payment
    to: mysql
    type: deployed_in
  - from: payment-service
    to: mysql
    type: deployed_in
  - from: payment-sync-scheduler
    to: mysql
    type: deployed_in

# ══════════════════════════════════════
# Notes
# ══════════════════════════════════════

notes:
  - id: round
    body: |
      Round 2: 설계 확정. Round 3: 예약 생성 핵심 슬라이스 구현 —
      reservation, reservation-nightly, daily-room-inventory, daily-room-rate,
      reservation-service(create 만), inventory-service(reserve 만)가 `active`.
      Round 4: 찜(wishlist, property-wishlist-count, wishlist-service)과 예약-쿠폰 통합 구현.
      찜은 별도 최상위 패키지(domain/wishlist)에 배치(예약과 응집도 낮음). 쿠폰은 별도 도메인(abox/coupon.yaml).
      reservation-service.create 가 coupon 도메인의 사용 처리를 단일 트랜잭션에서 호출(cross-domain 참조).
      구현은 BaseEntity 컨벤션(surrogate Long PK)을 따르므로, 설계의 복합 PK 는 UNIQUE 제약으로 동일 보장한다.
      Round 5: 검색 최적화 — property, room-type, property-search 가 `active`.
      Property/RoomType 은 검색에 필요한 최소 필드로 domain/property 패키지에 신규 구현(예약 도메인의 domain/accommodation 과 분리).
      검색 read model 은 infrastructure/property/PropertySearchJdbcRepository(네이티브 SQL),
      캐시는 application/property/PropertyFacade + infrastructure/property/PropertyRedisCacheRepository(cache-aside).
      벤치마크 시드는 support/seed/Round5SeedRunner(seed 프로필), 측정 결과는 docs/perf/round5-search-optimization.md.
      Round 6: 예약 확정·취소·만료 슬라이스 — reservation-service 생애주기 완성(confirm/cancel/expire/expireOverdue),
      inventory-service.release, coupon 복구(restoreIfUsed), expiration-scheduler 가 `active`.
      Round 6.5: PG 결제 연동 — payment, payment-service, payment-sync-scheduler 가 `active`.
      결제 오케스트레이션(PG 호출·콜백 검증·예약 후속 전이)은 application/payment/PaymentFacade,
      PG 클라이언트는 infrastructure/payment/pg(OpenFeign + resilience4j 서킷 2분리 — PgSimulatorCircuitCaller 가 계측, PgSimulatorGateway 가 예외를 결과 타입으로 흡수).
      로컬 PG 는 apps/pg-simulator 모듈(포트 8082). 도메인 이벤트(outbox), NO_SHOW/자동 체크아웃 스케줄러, 환불 산정은 후속.
      예약·재고·요금 active entity 코드는 apps/commerce-api/.../domain/accommodation 패키지에 flat 배치, 찜은 domain/wishlist, 숙소·객실 타입은 domain/property, 결제는 domain/payment.

  - id: state-machine
    body: |
      Reservation 상태 머신은 `wiki/accommodation/design-decisions.md#state-machine`과
      `docs/design/01-requirements.md § 5`에 동일하게 명시되어 있다.

  - id: extensions
    body: |
      이번 라운드 범위 외:
      - 다중 객실 예약(E1), 가변 가격(E2), 멤버십 등급별 가격(E3), 단체 예약(E4)
      - 위약금·환불 산정 (P5 합의: 트리거·상태만, 정산은 후속)
      - RoomInstance(특정 호실) 식별 (B4 합의: 이번 라운드 제외)

  - id: future-domains
    body: |
      후속 추가 검토 도메인:
      - cancellation-policy (취소·환불 정책)
      - refund-service (외부 PG 환불 호출·정산)
      - host-management (호스트 운영자 콘솔)
